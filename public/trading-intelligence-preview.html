<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>MOERAND Trading Intelligence Preview</title>
  <style>
    html,body{height:100%;margin:0;background:#020a12;color:#dbe8f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .loading{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at top,#0b2842 0,#061525 40%,#020a12 100%)}
    .card{max-width:520px;padding:24px;border:1px solid rgba(78,121,158,.5);border-radius:18px;background:rgba(6,20,35,.9)}
    h1{font-size:22px;margin:0 0 10px}.muted{color:#8fa4bf;line-height:1.6}.lock{display:inline-block;margin-top:14px;padding:7px 10px;border:1px solid #28684c;border-radius:999px;color:#83e9b2;font-size:10px;font-weight:900}
  </style>
</head>
<body>
  <main class="loading"><section class="card"><h1>جاري تحميل الواجهة الجديدة</h1><div class="muted" id="status">Trading Intelligence Preview · Paper Trading Only</div><span class="lock">OBSERVATION ONLY</span></section></main>
  <script>
    const source='https://raw.githubusercontent.com/Mosaprajb/MOE-AI/feature/order-lifecycle-reconciliation/docs/preview/trading-intelligence.html';
    fetch(source,{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error('Preview source unavailable');return response.text();})
      .then(html=>{document.open();document.write(html);document.close();})
      .catch(error=>{document.getElementById('status').textContent='تعذر تحميل المعاينة: '+(error.message||error);});
  </script>
</body>
</html>
