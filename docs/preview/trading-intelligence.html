<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MOERAND Trading Intelligence Preview</title>
<style>
:root{--bg:#020a12;--panel:#071726;--panel2:#06111e;--line:rgba(78,121,158,.44);--text:#dbe8f5;--muted:#8fa4bf;--blue:#66b8ff;--green:#54dfa0;--red:#ff7f8c;--yellow:#f5bf62;--purple:#b992ff;--disabled:#53677d}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-width:0;background:radial-gradient(circle at top,#0b2842 0,#061525 38%,#020a12 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}.shell{width:min(1500px,100%);margin:auto;padding:18px}.hero,.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(8,28,47,.95),rgba(4,14,26,.99));border-radius:19px;box-shadow:0 18px 45px rgba(0,0,0,.22)}.hero{padding:18px}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.eyebrow{font-size:9px;letter-spacing:.16em;color:#86b7db;font-weight:900}.hero h1,.panel h2,.panel h3{margin:5px 0}.hero h1{font-size:26px}.muted{color:var(--muted);line-height:1.55}.lock{display:inline-flex;padding:7px 10px;border:1px solid #28684c;border-radius:999px;color:#83e9b2;background:rgba(40,119,82,.14);font-size:10px;font-weight:900}.scenario-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.scenario{appearance:none;border:1px solid var(--line);border-radius:10px;background:#071421;color:#a9bdd1;padding:9px 12px;cursor:pointer;font-size:11px;font-weight:800}.scenario:hover,.scenario:focus-visible,.scenario.active{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(102,184,255,.16);color:#fff}.scenario.active{background:rgba(36,88,129,.22)}.panel{margin-top:14px;padding:16px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.status{padding:7px 10px;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:900}.NORMAL,.CONFIRMED,.ALIGNED,.ALLOWED,.PROTECTED{color:var(--green)}.DANGER,.CRITICAL,.BLOCKED,.REJECTED,.UNPROTECTED{color:var(--red)}.WARNING,.CONFLICTING,.PARTIALLY_PROTECTED{color:var(--yellow)}.UNAVAILABLE,.NO_POSITION{color:var(--disabled)}.summary-grid,.metric-grid{display:grid;gap:8px;margin-top:12px}.summary-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{padding:10px;border:1px solid rgba(54,90,126,.4);border-radius:11px;background:rgba(7,21,37,.72);min-width:0}.metric span{display:block;color:#7890aa;font-size:9px}.metric strong{display:block;margin-top:5px;font-size:12px;overflow-wrap:anywhere}.active-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:15px;margin-top:13px}.ring-shell{display:grid;place-items:center;align-content:center;padding:12px;border:1px solid rgba(55,94,132,.42);border-radius:15px;background:rgba(4,15,27,.7)}.ring{--score:0;--color:var(--blue);width:178px;height:178px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--color) calc(var(--score)*1%),rgba(75,102,128,.18) 0)}.ring:before{content:"";position:absolute;inset:15px;border-radius:50%;background:#061321;border:1px solid rgba(85,117,147,.42)}.ring-core{z-index:1;text-align:center}.ring-score{display:block;font-size:34px;font-weight:950}.ring-note{display:block;color:var(--muted);font-size:9px;margin-top:3px}.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.step{padding:9px;border:1px solid rgba(54,90,126,.4);border-radius:10px;color:var(--muted);font-size:9px}.step strong{display:block;font-size:10px;margin-bottom:4px}.step.PASSED{color:#83e9b2;border-color:#28684c}.step.ACTIVE{color:#9cd3ff;border-color:#2d6c9c}.step.FAILED{color:#ff9da7;border-color:#8a3b46}.warning{margin-top:10px;padding:10px;border:1px solid rgba(138,59,70,.8);border-radius:10px;background:rgba(153,49,63,.14);color:#ffb0b8;font-size:11px}.intel-layout{display:grid;grid-template-columns:minmax(230px,.42fr) minmax(0,1.58fr);gap:14px;margin-top:12px}.master,.gauge-wrap{border:1px solid rgba(64,105,144,.42);border-radius:16px;background:rgba(4,15,27,.66);padding:14px}.master{display:grid;place-items:center;align-content:center;min-height:320px}.master .ring{width:170px;height:170px}.gauge-grid{display:grid;grid-template-columns:repeat(4,minmax(135px,1fr));gap:10px}.gauge-card{appearance:none;color:inherit;text-align:inherit;width:100%;padding:10px;border:1px solid rgba(57,95,132,.42);border-radius:14px;background:rgba(7,20,34,.76);min-width:0;cursor:pointer}.gauge-card:hover,.gauge-card:focus-visible,.gauge-card.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(102,184,255,.16);outline:none}.gauge-head{display:flex;justify-content:space-between;gap:7px;align-items:flex-start}.gauge-title{font-size:11px;font-weight:900;line-height:1.25}.mini-status{font-size:8px;font-weight:900;padding:4px 5px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}.gauge{--score:0;--color:var(--disabled);width:108px;height:108px;border-radius:50%;margin:10px auto 7px;display:grid;place-items:center;position:relative;background:conic-gradient(var(--color) calc(var(--score)*1%),rgba(75,102,128,.18) 0)}.gauge:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#071421;border:1px solid rgba(85,117,147,.38)}.gauge .ring-score{font-size:23px}.gauge-summary{font-size:10px;line-height:1.45;color:#9eb2c8;min-height:43px;overflow-wrap:anywhere}.detail{margin-top:12px;padding:14px;border:1px solid rgba(64,105,144,.42);border-radius:15px;background:rgba(5,18,32,.78)}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 0}.flow-step{padding:7px 9px;border-radius:10px;border:1px solid rgba(67,103,138,.42);font-size:9px;font-weight:850;color:var(--muted)}.flow-step.pass{color:#83e9b2;border-color:#28684c}.flow-step.fail{color:#ff9da7;border-color:#8a3b46}.portfolio-layout,.conflict-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.box{padding:12px;border:1px solid rgba(61,99,134,.42);border-radius:13px;background:rgba(5,18,32,.72);min-width:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{max-width:100%;padding:5px 7px;border-radius:999px;border:1px solid rgba(72,107,140,.52);font-size:8px;color:#a9bdd1;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.tag.block{color:#ff9da7;border-color:#8a3b46}.headline{margin-top:10px;padding:10px;border-inline-start:3px solid var(--blue);background:rgba(36,88,129,.12);font-size:11px;line-height:1.5;overflow-wrap:anywhere}.signal{padding:10px;border:1px solid rgba(61,99,134,.36);border-radius:10px;background:rgba(7,21,37,.64)}.signal.support{border-color:rgba(40,104,76,.72)}.signal.conflict{border-color:rgba(138,59,70,.78)}.signal strong{display:block;font-size:11px}.signal span{display:block;margin-top:5px;color:var(--muted);font-size:9px;line-height:1.45}.feed{display:grid;gap:7px;max-height:360px;overflow:auto}.event{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px;border:1px solid rgba(54,90,126,.36);border-radius:10px;background:rgba(6,20,35,.64)}.event .sev{font-size:8px;font-weight:900}.event .body strong{display:block;font-size:10px}.event .body span{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.4;overflow-wrap:anywhere}.event time{font-size:8px;color:#70879f}.CRITICAL .sev{color:#ff6474}.WARNING .sev{color:var(--yellow)}.POSITIVE .sev{color:var(--green)}.INFO .sev{color:var(--blue)}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed rgba(60,96,131,.45);border-radius:12px}.footer{text-align:center;color:#607b96;font-size:10px;padding:20px}.ltr{direction:ltr;unicode-bidi:isolate}.hidden{display:none!important}@media(max-width:1250px){.gauge-grid{grid-template-columns:repeat(3,minmax(135px,1fr))}.summary-grid{grid-template-columns:repeat(3,1fr)}.metric-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.active-layout,.intel-layout,.portfolio-layout,.conflict-layout{grid-template-columns:1fr}.gauge-grid{grid-template-columns:repeat(2,minmax(135px,1fr))}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.timeline{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:10px}.hero,.panel{padding:12px}.hero h1{font-size:20px}.summary-grid,.metric-grid,.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gauge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gauge{width:92px;height:92px}.master .ring{width:150px;height:150px}.timeline{grid-template-columns:1fr}.event{grid-template-columns:60px minmax(0,1fr)}.event time{grid-column:2}.gauge-title,.mini-status,.gauge-summary,.headline,.metric strong,.metric span,.tag{overflow-wrap:anywhere;word-break:break-word;min-width:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="hero">
  <div class="topline"><div><div class="eyebrow">MOERAND VISUAL PREVIEW</div><h1>Trading Intelligence Dashboard</h1><div class="muted">معاينة تفاعلية للواجهة الجديدة باستخدام بيانات Paper ثابتة وآمنة.</div></div><span class="lock">OBSERVATION ONLY · PAPER TRADING</span></div>
  <div class="scenario-bar" role="group" aria-label="Preview scenarios">
    <button class="scenario active" data-scenario="long">Long · Healthy</button>
    <button class="scenario" data-scenario="short">Short · Risk Blocked</button>
    <button class="scenario" data-scenario="missing">Missing Data</button>
  </div>
</header>
<section class="panel" id="activePanel"></section>
<section class="panel" id="intelligencePanel"></section>
<section class="panel" id="portfolioPanel"></section>
<section class="panel" id="conflictPanel"></section>
<footer class="footer">Preview only · No broker connection · No order submission path · Live execution disabled</footer>
</div>
<script>
const gaugeNames=[['higher-timeframe-bias','HTF Bias'],['market-regime','Market Regime'],['relative-volume','RVOL'],['liquidity-sweep','Liquidity Sweep'],['stop-run','Stop Run'],['smart-money','Smart Money'],['smt-divergence','SMT Divergence'],['absorption','Absorption'],['market-imbalance','Imbalance'],['market-structure','Market Structure'],['risk-quality','Risk Quality'],['setup-confidence','Setup Confidence'],['data-quality','Data Quality'],['execution-quality','Execution Quality']];
const baseLong={symbol:'AAPL',direction:'LONG',risk:'NORMAL',protection:'PROTECTED',position:'MANAGING',entry:227.35,current:230.20,stop:224.80,target:233.10,pnl:2.85,progress:50,readiness:83,status:'ALIGNED',portfolio:'ALLOWED',cash:12480.52,bp:24961.04,nlv:25144.70,daily:145.60,openRisk:2.55,headline:'AAPL analytical evidence is aligned, but execution remains observation-only.',blockers:['OBSERVATION_ONLY','EXECUTION_PERMISSION_FALSE'],support:'Liquidity Sweep confirmed with directional reclaim.',conflict:'Execution remains disabled by observation-only safety locks.',scores:[84,78,72,86,88,81,77,82,80,85,79,83,92,91],states:['CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','BLOCKED'],events:[['POSITIVE','SMT divergence confirmed','Correlated-market divergence passed validation.'],['INFO','Session RVOL elevated','AAPL relative volume reached 1.82×.'],['POSITIVE','Institutional Flow pipeline confirmed','All mandatory analytical stages passed.']]};
const baseShort={symbol:'TSLA',direction:'SHORT',risk:'DANGER',protection:'PARTIALLY_PROTECTED',position:'MANAGING',entry:322.40,current:325.95,stop:327.15,target:311.75,pnl:-3.55,progress:-33,readiness:58,status:'BLOCKED',portfolio:'BLOCKED',cash:12480.52,bp:24961.04,nlv:25144.70,daily:-512.25,openRisk:4.75,headline:'TSLA is not ready: Structure confirmation failed after the imbalance.',blockers:['NO_CONFIRMED_STRUCTURE_EVENT','DAILY_LOSS_LIMIT_REACHED','MAXIMUM_DAILY_TRADES_REACHED','SPREAD_TOO_WIDE'],support:'Stop Run confirmed with bearish rejection.',conflict:'Market Structure rejected because no confirmed structure event exists.',scores:[76,78,70,86,88,81,0,82,80,42,38,58,51,49],states:['CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','CONFIRMED','UNAVAILABLE','CONFIRMED','CONFIRMED','REJECTED','BLOCKED','CONFLICTING','REJECTED','BLOCKED'],events:[['CRITICAL','Portfolio risk gate blocked','Daily loss limit reached.'],['WARNING','Position protection incomplete','TSLA protection is partially protected.'],['WARNING','Execution quality degraded','Spread too wide.'],['WARNING','Structure Confirmation rejected','No confirmed structure event exists.']]};
const missing={symbol:null,direction:'NO TRADE',risk:'NO_POSITION',protection:'UNAVAILABLE',position:'NO POSITION',entry:null,current:null,stop:null,target:null,pnl:null,progress:0,readiness:0,status:'UNAVAILABLE',portfolio:'BLOCKED',cash:null,bp:null,nlv:null,daily:0,openRisk:0,headline:'No scanner opportunity is available for conflict analysis.',blockers:['CAPITAL_DATA_UNAVAILABLE','EQUITY_UNAVAILABLE_FOR_PERCENT_RISK'],support:'No supportive signal is available.',conflict:'Capital data is unavailable; no values were fabricated.',scores:Array(14).fill(0),states:Array(14).fill('UNAVAILABLE'),events:[['WARNING','Portfolio risk gate blocked','Capital data unavailable.'],['INFO','No setup available','Scanner evaluated 40 symbols with no completed candidate.']]};
const scenarios={long:baseLong,short:baseShort,missing};let current='long',selectedGauge=0;
const money=v=>Number.isFinite(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v):'—';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorFor=s=>s==='CONFIRMED'?'var(--green)':['REJECTED','BLOCKED'].includes(s)?'var(--red)':s==='CONFLICTING'?'var(--yellow)':'var(--disabled)';
function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}
function renderActive(d){const unavailable=!d.symbol;document.getElementById('activePanel').innerHTML=`<div class="panel-head"><div><div class="eyebrow">ACTIVE POSITION INTELLIGENCE</div><h2>${unavailable?'Trade Progress & Protection':`<span class="ltr">${d.symbol}</span> · ${d.direction}`}</h2><div class="muted">${unavailable?'لا توجد صفقة نشطة قابلة للعرض.':`${d.position} · SANDBOX LIFECYCLE RECONCILIATION`}</div></div><span class="status ${d.risk}">${d.risk.replaceAll('_',' ')}</span></div>${unavailable?'<div class="empty" style="margin-top:12px">No active position. All execution permissions remain disabled.</div>':`<div class="active-layout"><div class="ring-shell"><div class="ring" style="--score:${Math.max(0,Math.min(100,Math.abs(d.progress)))};--color:${d.risk==='NORMAL'?'var(--green)':'var(--red)'}"><div class="ring-core"><span class="ring-score">${d.progress}%</span><span class="ring-note">Progress to TP1</span></div></div><div class="tags"><span class="tag">${d.protection}</span><span class="tag">PAPER TRADING</span></div></div><div><div class="metric-grid">${metric('ENTRY',money(d.entry))}${metric('CURRENT',money(d.current))}${metric('STOP LOSS',money(d.stop))}${metric('TAKE PROFIT 1',money(d.target))}${metric('UNREALIZED P&L',money(d.pnl))}${metric('RISK STATE',d.risk)}${metric('PROTECTION',d.protection)}${metric('EXECUTION','BLOCKED')}</div><div class="timeline"><div class="step PASSED"><strong>Entry</strong>Filled</div><div class="step ${d.protection==='PROTECTED'?'PASSED':'FAILED'}"><strong>Protection</strong>${d.protection}</div><div class="step ACTIVE"><strong>Management</strong>Position monitored</div><div class="step"><strong>Exit</strong>Waiting</div></div>${d.risk==='DANGER'?'<div class="warning"><strong>Attention required:</strong> Stop distance critical · Partial protection</div>':''}</div></div>`}`}
function gaugeCard(d,index){const state=d.states[index],score=d.scores[index],name=gaugeNames[index][1];return `<button type="button" class="gauge-card ${selectedGauge===index?'selected':''}" data-gauge="${index}" aria-label="${esc(name)} ${state} score ${score}"><div class="gauge-head"><span class="gauge-title">${name}</span><span class="mini-status ${state}">${state.replaceAll('_',' ')}</span></div><div class="gauge" style="--score:${score};--color:${colorFor(state)}"><div class="ring-core"><span class="ring-score">${score||'—'}</span><span class="ring-note">${d.direction}</span></div></div><div class="gauge-summary">${state==='CONFIRMED'?`${name} supports the ${d.direction.toLowerCase()} setup.`:state==='UNAVAILABLE'?`${name} data is unavailable.`:`${name} is ${state.toLowerCase().replaceAll('_',' ')}.`}</div></button>`}
function renderIntelligence(d){const steps=['STOP RUN','ABSORPTION','IMBALANCE','STRUCTURE','RISK'];const failed=d.status==='BLOCKED'?3:-1;document.getElementById('intelligencePanel').innerHTML=`<div class="panel-head"><div><div class="eyebrow">CIRCULAR TRADING INTELLIGENCE</div><h2>Institutional Flow Command Center</h2><div class="muted">اختر عدادًا لعرض تفاصيل الأداة وحالتها.</div></div><span class="lock">OBSERVATION ONLY</span></div><div class="summary-grid">${metric('ENGINE','INSTITUTIONAL FLOW')}${metric('TIMEFRAME','5m → 1h')}${metric('SCANNED SYMBOLS','40')}${metric('COMPLETED',d.status==='ALIGNED'?'1':'0')}${metric('SELECTED',d.symbol||'NO SETUP')}</div>${d.symbol?`<div class="intel-layout"><section class="master"><div class="ring" style="--score:${d.readiness};--color:${d.status==='ALIGNED'?'var(--green)':'var(--red)'}"><div class="ring-core"><span class="ring-score">${d.readiness}</span><span class="ring-note">${d.direction}</span><span class="ring-note">TRADE READINESS</span></div></div><div class="tags"><span class="tag">Mandatory ${d.status==='ALIGNED'?'7/7':'5/7'}</span><span class="tag block">EXECUTION BLOCKED</span></div><div class="flow">${steps.map((s,i)=>`<span class="flow-step ${i<failed||failed<0?'pass':i===failed?'fail':''}">${s}</span>`).join('<span>←</span>')}</div></section><section class="gauge-wrap"><div class="gauge-grid">${gaugeNames.map((_,i)=>gaugeCard(d,i)).join('')}</div></section></div><div class="detail"><div class="panel-head"><div><div class="eyebrow">GAUGE DETAIL</div><h3>${gaugeNames[selectedGauge][1]}</h3><div class="muted">${d.states[selectedGauge]==='CONFIRMED'?'Confirmation evidence is available.':'The selected gauge is not fully confirmed.'}</div></div><span class="status ${d.states[selectedGauge]}">${d.states[selectedGauge]}</span></div><div class="detail-grid">${metric('SCORE',d.scores[selectedGauge]||'—')}${metric('DIRECTION',d.direction)}${metric('TIMEFRAME','5m')}${metric('MANDATORY',selectedGauge>=3&&selectedGauge!==5&&selectedGauge!==6&&selectedGauge!==11?'YES':'NO')}</div></div>`:'<div class="empty" style="margin-top:12px">No qualified scanner result. Gauges remain unavailable until valid data and a setup are present.</div>'}`;document.querySelectorAll('[data-gauge]').forEach(b=>b.onclick=()=>{selectedGauge=Number(b.dataset.gauge);renderIntelligence(d)})}
function renderPortfolio(d){const missing=d.cash==null;document.getElementById('portfolioPanel').innerHTML=`<div class="panel-head"><div><div class="eyebrow">PORTFOLIO & CAPITAL RISK</div><h2>Portfolio Risk Command Panel</h2><div class="muted">قراءة فقط من بيانات Sandbox أو Stored Capital Policy.</div></div><span class="status ${d.portfolio}">RISK GATE ${d.portfolio}</span></div><div class="metric-grid">${metric('DAY BUYING POWER',money(d.bp))}${metric('NET LIQUIDATION',money(d.nlv))}${metric('DAILY P&L',money(d.daily))}${metric('OPEN RISK',money(d.openRisk))}${metric('CASH',money(d.cash))}${metric('SETTLED CASH',missing?'—':money(d.cash-1455.27))}${metric('OPEN POSITIONS',d.symbol?'1':'0')}${metric('EXECUTION PERMISSION','FALSE')}</div><div class="portfolio-layout"><div class="box"><h3>Capital Status</h3><div class="headline">${missing?'Capital data is unavailable. The interface leaves values blank instead of fabricating Equity or Buying Power.':d.portfolio==='ALLOWED'?'Portfolio is within paper-trading risk limits.':'Portfolio cannot accept additional risk.'}</div></div><div class="box"><h3>Blockers & Warnings</h3><div class="tags">${d.blockers.map(x=>`<span class="tag ${d.portfolio==='BLOCKED'?'block':''}">${x}</span>`).join('')}</div></div></div>`}
function renderConflict(d){document.getElementById('conflictPanel').innerHTML=`<div class="panel-head"><div><div class="eyebrow">CONFLICT SUMMARY & ACTIVITY</div><h2>Trading Intelligence Command Center</h2></div><span class="status ${d.status}">${d.status}</span></div><div class="headline">${d.headline}</div><div class="summary-grid">${metric('SELECTED SYMBOL',d.symbol||'—')}${metric('DIRECTION',d.direction)}${metric('MANDATORY CONFLICTS',d.status==='ALIGNED'?'0':String(d.blockers.length))}${metric('SUPPORTIVE SIGNALS',d.status==='ALIGNED'?'13':d.symbol?'8':'0')}${metric('EXECUTION','FALSE')}</div><div class="conflict-layout"><div class="box"><h3>STRONGEST SUPPORT</h3><div class="signal support"><strong>${d.support}</strong><span>Analytical evidence only. It never authorizes execution.</span></div></div><div class="box"><h3>STRONGEST CONFLICT</h3><div class="signal conflict"><strong>${d.conflict}</strong><span>Primary reason used to explain readiness status.</span></div></div></div><div class="conflict-layout"><div class="box"><h3>ALL BLOCKING REASONS</h3><div class="tags">${d.blockers.map(x=>`<span class="tag block">${x}</span>`).join('')}</div></div><div class="box"><h3>DEDUPLICATED ACTIVITY FEED</h3><div class="feed">${d.events.map((e,i)=>`<div class="event ${e[0]}"><span class="sev">${e[0]}</span><div class="body"><strong>${e[1]}</strong><span>${e[2]}</span></div><time>${['10:30','10:29','10:27','10:25'][i]||'10:24'}</time></div>`).join('')}</div></div></div>`}
function render(){const d=scenarios[current];renderActive(d);renderIntelligence(d);renderPortfolio(d);renderConflict(d);document.querySelectorAll('.scenario').forEach(b=>b.classList.toggle('active',b.dataset.scenario===current))}
document.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>{current=b.dataset.scenario;selectedGauge=0;render()});render();
</script>
</body>
</html>
