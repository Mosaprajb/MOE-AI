name: Validate Mobile Scanner UI Fix

on:
  pull_request:
    paths:
      - 'worker/src/mobile-scanner-visible-ui.js'
      - 'worker/src/mobile-paper-broker-gate.js'
      - 'worker/src/sandbox-moerand-clean-utbot-entry.js'
      - 'worker/src/sandbox-mobile-account-balances-entry.js'
      - 'worker/src/sandbox-mobile-account-balances-implementation.js'
      - 'worker/test/mobile-scanner-monitor-contract.test.mjs'
      - 'wrangler.sandbox.jsonc'
      - '.github/workflows/validate-mobile-scanner-ui-fix.yml'

permissions:
  contents: read

concurrency:
  group: validate-mobile-scanner-ui-fix
  cancel-in-progress: false

jobs:
  test-deploy-verify:
    name: Test, deploy, and verify stopped-scanner mobile UI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate scanner UI source
        run: node --check worker/src/mobile-scanner-visible-ui.js

      - name: Test scanner UI and stopped-state contract
        run: node --test --test-concurrency=1 worker/test/mobile-scanner-monitor-contract.test.mjs

      - name: Test Sandbox entry and Live safety chain
        run: |
          node --test --test-concurrency=1 worker/test/sandbox-simulation-mode.test.mjs
          node --test --test-concurrency=1 worker/test/sandbox-runtime-pilot-observability.test.mjs

      - name: Run complete Worker suite
        run: npm run test:worker

      - name: Confirm Sandbox deployment safety
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('wrangler.sandbox.jsonc', 'utf8'));
          const cleanEntry = readFileSync('worker/src/sandbox-moerand-clean-utbot-entry.js', 'utf8');
          const accountEntry = readFileSync('worker/src/sandbox-mobile-account-balances-entry.js', 'utf8');
          const expected = {
            MOE_SANDBOX_PILOT_ENABLED: 'false',
            MOE_LIVE_MODE_UNLOCKED: 'false',
            MOE_LIVE_EXECUTION_IMPLEMENTED: 'false',
            WEBULL_LIVE_TRADING: 'false',
            WEBULL_LIVE_ORDER_SUBMISSION: 'false',
            WEBULL_LIVE_AUTOMATION_ARMED: 'false',
            WEBULL_LIVE_KILL_SWITCH: 'true',
          };
          if (config.main !== 'worker/src/sandbox-moerand-clean-utbot-entry.js') {
            throw new Error(`Unexpected Sandbox entry: ${config.main}`);
          }
          if (!/from '\.\/sandbox-mobile-account-balances-entry\.js'/.test(cleanEntry)) {
            throw new Error('Clean wrapper does not delegate to the protected mobile account entry');
          }
          if (!/from '\.\/sandbox-mobile-account-balances-implementation\.js'/.test(accountEntry)) {
            throw new Error('Mobile account wrapper does not delegate to its protected implementation');
          }
          for (const [key, value] of Object.entries(expected)) {
            if (config.vars?.[key] !== value) throw new Error(`${key} must remain ${value}`);
          }
          console.log(JSON.stringify({
            sandboxEntry: config.main,
            wrapperChainVerified: true,
            ...expected,
          }, null, 2));
          NODE

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed UI and stopped scanner gates
        env:
          MOBILE_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/m
          MONITOR_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/scanner/monitor?symbol=SPY
          ACTIVITY_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/scanner/live-activity
        run: |
          node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function retry(label, operation) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                return await operation();
              } catch (error) {
                lastError = error;
                console.log(`${label} attempt ${attempt} failed: ${error.message}`);
                await wait(5000);
              }
            }
            throw lastError || new Error(`${label} unavailable`);
          }

          const html = await retry('mobile dashboard', async () => {
            const response = await fetch(`${process.env.MOBILE_URL}?scanner-ui-fix=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          });

          for (const token of [
            'id="moe-mobile-scanner-visible-ui"',
            "chips.insertAdjacentElement('afterend',makeMonitor('main'))",
            "body.insertAdjacentElement('afterbegin',makeMonitor('scanner'))",
            "list.insertAdjacentElement('beforebegin',tools)",
            'moeActivityRefreshVisible',
            'moeActivityClearVisible',
            'Scanner stopped. Press Start trading',
          ]) {
            if (!html.includes(token)) throw new Error(`Mobile dashboard missing ${token}`);
          }

          const headers = { 'x-moe-mobile-client': '1', accept: 'application/json' };
          const monitor = await retry('scanner monitor', async () => {
            const response = await fetch(`${process.env.MONITOR_URL}&t=${Date.now()}`, { cache: 'no-store', headers });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.ok !== true) throw new Error(`HTTP ${response.status}: ${payload.error || 'invalid payload'}`);
            return payload;
          });

          if (monitor.symbol !== 'SPY' || !monitor.quote || !Object.hasOwn(monitor.quote, 'price')) {
            throw new Error('Live SPY quote is missing');
          }
          if (!monitor.safety?.liveTradingLocked || monitor.safety?.liveFundsUsed !== false) {
            throw new Error('Live safety lock changed unexpectedly');
          }
          if (monitor.scannerArmed === false) {
            if (monitor.plan !== null) throw new Error('Stopped scanner exposed an execution plan');
            if (Number(monitor.readiness?.percent) !== 0) throw new Error('Stopped scanner readiness must be 0%');
          }

          const activity = await retry('scanner activity', async () => {
            const response = await fetch(`${process.env.ACTIVITY_URL}?t=${Date.now()}`, { cache: 'no-store', headers });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.ok !== true) throw new Error(`HTTP ${response.status}: ${payload.error || 'invalid payload'}`);
            return payload;
          });

          if (activity.scannerArmed === false) {
            if (!Array.isArray(activity.events) || activity.events.length !== 1 || activity.events[0]?.type !== 'SCANNER_WAITING') {
              throw new Error('Stopped scanner activity must show only SCANNER_WAITING');
            }
          }

          console.log(JSON.stringify({
            deployed: true,
            symbol: monitor.symbol,
            livePrice: monitor.quote.price,
            scannerArmed: monitor.scannerArmed,
            planVisible: monitor.plan !== null,
            readinessPercent: monitor.readiness?.percent,
            activityCount: activity.events?.length,
            activityType: activity.events?.[0]?.type,
            liveTradingLocked: true,
          }, null, 2));
          NODE
