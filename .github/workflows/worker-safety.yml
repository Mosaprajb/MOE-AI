name: Worker Safety Gate

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'worker/**'
      - 'package.json'
      - '.github/workflows/worker-safety.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'package.json'
      - '.github/workflows/worker-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run isolated Worker tests
        run: npm run test:worker

      - name: Verify production trading remains locked
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('worker/src/webull-sandbox.js', 'utf8');
          const requiredGuards = [
            "env.WEBULL_LIVE_TRADING === 'true'",
            "env.WEBULL_ENVIRONMENT === 'production'",
            "Production trading is intentionally disabled",
          ];

          for (const guard of requiredGuards) {
            if (!source.includes(guard)) {
              throw new Error(`Missing production trading guard: ${guard}`);
            }
          }

          console.log('Production trading lock is present.');
          EOF

      - name: Verify consensus integration remains active
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const sandbox = readFileSync('worker/src/webull-sandbox.js', 'utf8');
          const consensus = readFileSync('worker/src/institutional-consensus.js', 'utf8');
          const requiredMarkers = [
            'evaluateInstitutionalConsensus',
            'applyConsensusEnforcement',
            'INSTITUTIONAL_CONSENSUS_ENFORCED',
            'INSTITUTIONAL_CONSENSUS_SHADOW',
          ];

          for (const marker of requiredMarkers) {
            if (!sandbox.includes(marker)) {
              throw new Error(`Missing sandbox consensus integration marker: ${marker}`);
            }
          }

          if (!consensus.includes("INSTITUTIONAL_CONSENSUS_VERSION = '1.0.0'")) {
            throw new Error('Institutional consensus version marker is missing.');
          }

          console.log('Institutional consensus integration is present.');
          EOF
