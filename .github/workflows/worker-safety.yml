name: Worker Safety Gate

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'worker/**'
      - 'package.json'
      - '.github/workflows/worker-safety.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'package.json'
      - '.github/workflows/worker-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    name: Worker Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Verify kill switch defaults to safe (ON)
        run: |
          grep -q "return true" src/lib/risk.ts \
            && echo "PASS: kill switch defaults true in catch" \
            || { echo "FAIL: kill switch catch path missing"; exit 1; }

      - name: Verify no hardcoded credentials
        run: |
          ! grep -rE "(WEBULL_|secret_|api_key_)[A-Za-z0-9]{20,}" src/ \
            && echo "PASS: no hardcoded credentials found"

      - name: Verify CORS is applied globally
        run: |
          grep -q "corsMiddleware" src/index.ts \
            && echo "PASS: CORS middleware applied" \
            || { echo "FAIL: CORS middleware missing"; exit 1; }

      - name: Verify kill switch checked before orders
        run: |
          grep -q "getKillSwitch" src/routes/trading.ts \
            && echo "PASS: kill switch checked in trading route" \
            || { echo "FAIL: kill switch not checked before orders"; exit 1; }
