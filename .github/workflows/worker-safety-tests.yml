name: Worker Safety Tests

on:
  pull_request:
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'wrangler.sandbox.jsonc'
      - '.github/workflows/worker-safety-tests.yml'
  push:
    branches:
      - main
      - feature/moe-core-domain-v2
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'wrangler.sandbox.jsonc'
      - '.github/workflows/worker-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-safety:
    name: Worker safety, liquidity, and Smart Money engines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test duplicate-order reservations
        run: node --test --test-concurrency=1 worker/test/order-reservation.test.mjs

      - name: Test liquidity contracts and state machine
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-foundation.test.mjs

      - name: Test market-data metrics and rejection gates
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-market-metrics.test.mjs

      - name: Test session-normalized relative volume
        run: node --test --test-concurrency=1 worker/test/session-rvol.test.mjs

      - name: Test liquidity pool mapping
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-liquidity-map.test.mjs

      - name: Test sweep detection and breakout classification
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-classifier.test.mjs

      - name: Test confirmation trade planning and scoring
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-engine.test.mjs

      - name: Test Smart Money quantitative foundation
        run: node --test --test-concurrency=1 worker/test/smart-money-foundation.test.mjs

      - name: Test Smart Money zones breakers and confluence
        run: node --test --test-concurrency=1 worker/test/smart-money-zones-confluence.test.mjs

      - name: Test Smart Money setup selection and risk evaluation
        run: node --test --test-concurrency=1 worker/test/smart-money-selection-risk.test.mjs

      - name: Test Smart Money candidates lifecycle and scanner adapter
        run: node --test --test-concurrency=1 worker/test/smart-money-candidate-scanner.test.mjs

      - name: Test Smart Money observation sidecar
        run: node --test --test-concurrency=1 worker/test/smart-money-observation-service.test.mjs

      - name: Test Smart Money dashboard overlay
        run: node --test --test-concurrency=1 worker/test/smart-money-dashboard-overlay.test.mjs

      - name: Test institutional flow stage pipeline
        run: node --test --test-concurrency=1 worker/test/institutional-flow-pipeline.test.mjs

      - name: Test trade-level order flow and historical replay
        run: node --test --test-concurrency=1 worker/test/order-flow-replay.test.mjs

      - name: Test trading intelligence gauge contracts
        run: node --test --test-concurrency=1 worker/test/trading-intelligence-gauge-adapter.test.mjs

      - name: Test active position intelligence
        run: node --test --test-concurrency=1 worker/test/active-position-intelligence.test.mjs

      - name: Test SMT divergence intelligence
        run: node --test --test-concurrency=1 worker/test/smt-divergence.test.mjs

      - name: Test execution quality intelligence
        run: node --test --test-concurrency=1 worker/test/execution-quality.test.mjs

      - name: Test portfolio capital risk intelligence
        run: node --test --test-concurrency=1 worker/test/portfolio-risk-intelligence.test.mjs

      - name: Test portfolio risk dashboard overlay
        run: node --test --test-concurrency=1 worker/test/portfolio-risk-overlay.test.mjs

      - name: Test conflict summary and activity feed
        run: node --test --test-concurrency=1 worker/test/conflict-activity.test.mjs

      - name: Test conflict and activity dashboard overlay
        run: node --test --test-concurrency=1 worker/test/conflict-activity-overlay.test.mjs

      - name: Test final safety configuration
        run: node --test --test-concurrency=1 worker/test/final-safety-configuration.test.mjs

      - name: Test Real Sandbox runtime pilot observability
        run: node --test --test-concurrency=1 worker/test/sandbox-runtime-pilot-observability.test.mjs

      - name: Run complete Worker safety suite
        run: npm run test:worker

  dashboard-visual-qa:
    name: Dashboard visual QA (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run headless browser visual dashboard QA
        id: visual_qa
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
          VISUAL_QA_OUTPUT: artifacts/dashboard-visual-qa
          NODE_OPTIONS: --require=./worker/test/visual-cleanup-shim.cjs
        run: |
          set -o pipefail
          mkdir -p artifacts/dashboard-visual-qa
          node worker/test/visual-dashboard-browser.mjs 2>&1 | tee artifacts/dashboard-visual-qa/visual-qa.log

      - name: Upload dashboard visual QA artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-qa
          path: artifacts/dashboard-visual-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Report dashboard visual QA status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.visual_qa.outcome }}" = "failure" ]; then
            echo "::warning title=Dashboard Visual QA isolated::The headless visual dashboard check failed, but Worker Safety remains authoritative and blocking. Review the dashboard-visual-qa artifact."
            {
              echo "## Dashboard visual QA"
              echo ""
              echo "The headless browser check failed and was isolated from the blocking Worker Safety job."
              echo "Review the uploaded \`dashboard-visual-qa\` artifact and its \`visual-qa.log\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Dashboard visual QA"
              echo ""
              echo "The headless browser check passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sandbox-mobile-scanner-deploy:
    name: Deploy and verify Sandbox mobile scanner monitor
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 37 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/moe-core-domain-v2'
    needs: worker-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-test mobile scanner monitor contract
        run: node --test --test-concurrency=1 worker/test/mobile-scanner-monitor-contract.test.mjs

      - name: Confirm Sandbox and Live safety configuration
        run: node <<'NODE'
          const { readFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('wrangler.sandbox.jsonc', 'utf8'));
          const expected = {
            MOE_SANDBOX_PILOT_ENABLED: 'false',
            MOE_LIVE_MODE_UNLOCKED: 'false',
            MOE_LIVE_EXECUTION_IMPLEMENTED: 'false',
            WEBULL_LIVE_TRADING: 'false',
            WEBULL_LIVE_ORDER_SUBMISSION: 'false',
            WEBULL_LIVE_AUTOMATION_ARMED: 'false',
            WEBULL_LIVE_KILL_SWITCH: 'true',
          };
          if (config.main !== 'worker/src/sandbox-mobile-account-balances-entry.js') {
            throw new Error(`Unexpected Sandbox entry: ${config.main}`);
          }
          for (const [key, value] of Object.entries(expected)) {
            if (config.vars?.[key] !== value) throw new Error(`${key} must remain ${value}`);
          }
          console.log(JSON.stringify({ sandboxEntry: config.main, ...expected }, null, 2));
          NODE

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed mobile scanner monitor
        env:
          MOBILE_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/m
          MONITOR_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/scanner/monitor?symbol=SPY
        run: node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function retry(label, operation) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                return await operation();
              } catch (error) {
                lastError = error;
                console.log(`${label} attempt ${attempt} failed: ${error.message}`);
                await wait(5000);
              }
            }
            throw lastError || new Error(`${label} unavailable`);
          }

          const html = await retry('mobile dashboard', async () => {
            const response = await fetch(`${process.env.MOBILE_URL}?scanner-monitor=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          });

          for (const token of [
            'id="moe-mobile-two-account-balances"',
            'moeActivityRefresh',
            'moeActivityClear',
            'Clear old',
            'moeScannerMonitor',
            'Selected symbol live monitor',
            'moeMonitorRefresh',
            'moeMonitorSymbol',
            'moeMonitorPrice',
            'moeMonitorEntry',
            'moeMonitorExit',
            'moeMonitorStop',
            'moeMonitorFill',
            'Target / exit',
            'Readiness is an estimate of scanner gates',
          ]) {
            if (!html.includes(token)) throw new Error(`Mobile dashboard missing ${token}`);
          }

          const monitor = await retry('scanner monitor API', async () => {
            const response = await fetch(`${process.env.MONITOR_URL}&t=${Date.now()}`, {
              cache: 'no-store',
              headers: { 'x-moe-mobile-client': '1', accept: 'application/json' },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${payload.error || 'unknown error'}`);
            return payload;
          });

          if (monitor.ok !== true || monitor.symbol !== 'SPY') throw new Error('Scanner monitor response is invalid');
          if (!monitor.quote || !Object.hasOwn(monitor.quote, 'price')) throw new Error('Live quote field is missing');
          if (!monitor.readiness || !Number.isFinite(Number(monitor.readiness.percent))) throw new Error('Readiness percent is missing');
          if (!monitor.scanner || !Object.hasOwn(monitor.scanner, 'signal')) throw new Error('Scanner status is missing');
          if (monitor.plan != null) {
            for (const key of ['entryPrice', 'exitPrice', 'stopLossPrice']) {
              if (!Object.hasOwn(monitor.plan, key)) throw new Error(`Scanner plan missing ${key}`);
            }
          }

          console.log(JSON.stringify({
            deployed: true,
            symbol: monitor.symbol,
            livePrice: monitor.quote.price,
            entryPrice: monitor.plan?.entryPrice ?? null,
            exitPrice: monitor.plan?.exitPrice ?? null,
            stopLossPrice: monitor.plan?.stopLossPrice ?? null,
            readinessPercent: monitor.readiness.percent,
            readinessColor: monitor.readiness.color,
            activityRefresh: true,
            activityClear: true,
            liveTradingLocked: true,
          }, null, 2));
          NODE
