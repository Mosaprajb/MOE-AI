name: Worker Safety Tests

on:
  pull_request:
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - '.github/workflows/worker-safety-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - '.github/workflows/worker-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-safety:
    name: Worker safety and liquidity engine
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test duplicate-order reservations
        run: node --test worker/test/order-reservation.test.mjs

      - name: Test liquidity contracts and state machine
        run: node --test worker/test/liquidity-sweep-foundation.test.mjs

      - name: Test market-data normalization and liquidity mapping
        run: node --test worker/test/liquidity-sweep-market-data.test.mjs

      - name: Test sweep detection and breakout classification
        run: node --test worker/test/liquidity-sweep-classifier.test.mjs

      - name: Test confirmation trade planning and scoring
        run: node --test worker/test/liquidity-sweep-engine.test.mjs

      - name: Run all Worker tests in isolated processes
        id: complete-suite
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:worker > worker-test-report.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Worker test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-test-report
          path: worker-test-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce complete Worker suite
        if: always()
        shell: bash
        run: test "${{ steps.complete-suite.outputs.exit_code }}" = "0"
