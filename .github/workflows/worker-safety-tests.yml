name: Worker Safety Tests

on:
  pull_request:
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - '.github/workflows/worker-safety-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - '.github/workflows/worker-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-safety:
    name: Worker safety and liquidity engine
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test duplicate-order reservations
        run: node --test --test-concurrency=1 worker/test/order-reservation.test.mjs

      - name: Test liquidity contracts and state machine
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-foundation.test.mjs

      - name: Capture market-data metrics test
        id: market-metrics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 worker/test/liquidity-sweep-market-metrics.test.mjs > market-metrics-report.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload market metrics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-metrics-report
          path: market-metrics-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Test liquidity pool mapping
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-liquidity-map.test.mjs

      - name: Test sweep detection and breakout classification
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-classifier.test.mjs

      - name: Test confirmation trade planning and scoring
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-engine.test.mjs

      - name: Run complete Worker safety suite
        continue-on-error: true
        run: npm run test:worker

      - name: Enforce market metrics result
        if: always()
        run: test "${{ steps.market-metrics.outputs.exit_code }}" = "0"
