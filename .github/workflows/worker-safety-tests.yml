name: Worker Safety Tests

on:
  pull_request:
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'wrangler.sandbox.jsonc'
      - '.github/workflows/worker-safety-tests.yml'
  push:
    branches:
      - main
      - feature/moe-core-domain-v2
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'wrangler.sandbox.jsonc'
      - '.github/workflows/worker-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-safety:
    name: Worker safety, liquidity, and Smart Money engines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test duplicate-order reservations
        run: node --test --test-concurrency=1 worker/test/order-reservation.test.mjs

      - name: Test liquidity contracts and state machine
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-foundation.test.mjs

      - name: Test market-data metrics and rejection gates
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-market-metrics.test.mjs

      - name: Test session-normalized relative volume
        run: node --test --test-concurrency=1 worker/test/session-rvol.test.mjs

      - name: Test liquidity pool mapping
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-liquidity-map.test.mjs

      - name: Test sweep detection and breakout classification
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-classifier.test.mjs

      - name: Test confirmation trade planning and scoring
        run: node --test --test-concurrency=1 worker/test/liquidity-sweep-engine.test.mjs

      - name: Test Smart Money quantitative foundation
        run: node --test --test-concurrency=1 worker/test/smart-money-foundation.test.mjs

      - name: Test Smart Money zones breakers and confluence
        run: node --test --test-concurrency=1 worker/test/smart-money-zones-confluence.test.mjs

      - name: Test Smart Money setup selection and risk evaluation
        run: node --test --test-concurrency=1 worker/test/smart-money-selection-risk.test.mjs

      - name: Test Smart Money candidates lifecycle and scanner adapter
        run: node --test --test-concurrency=1 worker/test/smart-money-candidate-scanner.test.mjs

      - name: Test Smart Money observation sidecar
        run: node --test --test-concurrency=1 worker/test/smart-money-observation-service.test.mjs

      - name: Test Smart Money dashboard overlay
        run: node --test --test-concurrency=1 worker/test/smart-money-dashboard-overlay.test.mjs

      - name: Test institutional flow stage pipeline
        run: node --test --test-concurrency=1 worker/test/institutional-flow-pipeline.test.mjs

      - name: Test trade-level order flow and historical replay
        run: node --test --test-concurrency=1 worker/test/order-flow-replay.test.mjs

      - name: Test trading intelligence gauge contracts
        run: node --test --test-concurrency=1 worker/test/trading-intelligence-gauge-adapter.test.mjs

      - name: Test active position intelligence
        run: node --test --test-concurrency=1 worker/test/active-position-intelligence.test.mjs

      - name: Test SMT divergence intelligence
        run: node --test --test-concurrency=1 worker/test/smt-divergence.test.mjs

      - name: Test execution quality intelligence
        run: node --test --test-concurrency=1 worker/test/execution-quality.test.mjs

      - name: Test portfolio capital risk intelligence
        run: node --test --test-concurrency=1 worker/test/portfolio-risk-intelligence.test.mjs

      - name: Test portfolio risk dashboard overlay
        run: node --test --test-concurrency=1 worker/test/portfolio-risk-overlay.test.mjs

      - name: Test conflict summary and activity feed
        run: node --test --test-concurrency=1 worker/test/conflict-activity.test.mjs

      - name: Test conflict and activity dashboard overlay
        run: node --test --test-concurrency=1 worker/test/conflict-activity-overlay.test.mjs

      - name: Test final safety configuration
        run: node --test --test-concurrency=1 worker/test/final-safety-configuration.test.mjs

      - name: Test Real Sandbox runtime pilot observability
        run: node --test --test-concurrency=1 worker/test/sandbox-runtime-pilot-observability.test.mjs

      - name: Run complete Worker safety suite
        run: npm run test:worker

  dashboard-visual-qa:
    name: Dashboard visual QA (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run headless browser visual dashboard QA
        id: visual_qa
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
          VISUAL_QA_OUTPUT: artifacts/dashboard-visual-qa
          NODE_OPTIONS: --require=./worker/test/visual-cleanup-shim.cjs
        run: |
          set -o pipefail
          mkdir -p artifacts/dashboard-visual-qa
          node worker/test/visual-dashboard-browser.mjs 2>&1 | tee artifacts/dashboard-visual-qa/visual-qa.log

      - name: Upload dashboard visual QA artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-qa
          path: artifacts/dashboard-visual-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Report dashboard visual QA status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.visual_qa.outcome }}" = "failure" ]; then
            echo "::warning title=Dashboard Visual QA isolated::The headless visual dashboard check failed, but Worker Safety remains authoritative and blocking. Review the dashboard-visual-qa artifact."
            {
              echo "## Dashboard visual QA"
              echo ""
              echo "The headless browser check failed and was isolated from the blocking Worker Safety job."
              echo "Review the uploaded \`dashboard-visual-qa\` artifact and its \`visual-qa.log\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Dashboard visual QA"
              echo ""
              echo "The headless browser check passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
