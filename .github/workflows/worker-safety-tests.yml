name: Worker Safety Tests

on:
  pull_request:
    paths:
      - 'worker/**'
  push:
    branches: [main]
    paths:
      - 'worker/**'

jobs:
  safety-tests:
    name: Risk Engine Safety Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Verify kill switch defaults to ON
        run: |
          grep -q "return true" src/lib/risk.ts \
            && echo "PASS: kill switch defaults true" \
            || { echo "FAIL"; exit 1; }

      - name: Verify no hardcoded credentials
        run: |
          ! grep -rE "(WEBULL_|secret_|api_key_)[A-Za-z0-9]{20,}" src/ \
            && echo "PASS: no hardcoded credentials found"

      - name: Verify CORS is applied globally
        run: |
          grep -q "corsMiddleware" src/index.ts \
            && echo "PASS: CORS middleware applied" \
            || { echo "FAIL"; exit 1; }
