name: Validate Mobile Simulation PIN

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - ci/strategy-capacity-base-20260801

permissions:
  contents: read

concurrency:
  group: validate-mobile-simulation-pin
  cancel-in-progress: false

jobs:
  test-deploy-verify:
    name: Test, deploy, and verify iPhone PIN persistence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/moe-core-domain-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run mobile PIN regression test
        run: node --test worker/test/simulation-dashboard-mobile-pin.test.mjs

      - name: Run complete Worker safety suite
        run: npm run test:worker

      - name: Confirm Sandbox safety configuration
        shell: bash
        run: |
          grep -F '"MOE_SANDBOX_PILOT_ENABLED": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_TRADING": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_ORDER_SUBMISSION": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_AUTOMATION_ARMED": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_KILL_SWITCH": "true"' wrangler.sandbox.jsonc

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed iPhone PIN fix
        env:
          DASHBOARD_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/dashboard
        run: |
          node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let html = '';
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${process.env.DASHBOARD_URL}?mobile-pin=${Date.now()}`, { cache: 'no-store' });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              html = await response.text();
              break;
            } catch (error) {
              lastError = error;
              await wait(5000);
            }
          }
          if (!html) throw lastError || new Error('Dashboard unavailable');

          for (const token of [
            "let pinDraft=''",
            "pinNode.value=pinDraft",
            "const currentPin=document.getElementById('sim-pin')",
            "pinDraft='';const pinNode=document.getElementById('sim-pin')",
            'enterkeyhint="done"',
            'autocomplete="off"',
            'MOERAND_SCALP_INTERNAL',
            'SESSION LIMIT',
          ]) {
            if (!html.includes(token)) throw new Error(`Dashboard missing ${token}`);
          }
          if (html.includes('localStorage') || html.includes('sessionStorage')) {
            throw new Error('PIN persistence must not use browser storage');
          }

          console.log(JSON.stringify({
            deployed: true,
            iPhoneKeyboardDonePreserved: true,
            scrollBlurPreserved: true,
            pageMemoryOnly: true,
            clearedAfterSessionAcceptance: true,
            persistentBrowserStorageUsed: false,
          }, null, 2));
          NODE
