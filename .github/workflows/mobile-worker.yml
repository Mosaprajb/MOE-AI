name: Mobile Worker Integration

on:
  pull_request:
    paths:
      - "worker/src/lib/mobile-*.ts"
      - "worker/src/lib/apns.ts"
      - "worker/src/routes/mobile.ts"
      - "worker/src/index.ts"
      - "worker/migrations/0003_mobile_native_api.sql"
      - "worker/test/mobile-*.test.mjs"
      - "worker/test/mobile-local-e2e.mjs"
      - "worker/package.json"
      - "worker/wrangler.toml"
      - ".github/workflows/mobile-worker.yml"
  push:
    branches:
      - "agent/mobile-worker-integration"
    paths:
      - "worker/**"
      - ".github/workflows/mobile-worker.yml"

permissions:
  contents: read

concurrency:
  group: mobile-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate native mobile Worker API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Type-check Worker
        working-directory: worker
        run: pnpm run type-check

      - name: Run mobile session, APNs, and route integration tests
        working-directory: worker
        run: pnpm run test:mobile

      - name: Apply local D1 migrations
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply moe-ai --local

      - name: Run local Worker HTTP contract
        working-directory: worker
        shell: bash
        env:
          MOE_LOCAL_CONTROL_PIN: "246810"
        run: |
          set -euo pipefail
          cat > .dev.vars <<'EOF'
          MOE_MOBILE_CONTROL_PIN=246810
          MOE_MOBILE_SESSION_SECRET=mobile-ci-session-secret-0123456789abcdef0123456789abcdef
          EOF

          LOG_FILE="$RUNNER_TEMP/moe-mobile-local-worker.log"
          pnpm exec wrangler dev --local --ip 127.0.0.1 --port 8787 > "$LOG_FILE" 2>&1 &
          WORKER_PID=$!
          cleanup() {
            kill "$WORKER_PID" >/dev/null 2>&1 || true
            wait "$WORKER_PID" >/dev/null 2>&1 || true
            rm -f .dev.vars
          }
          trap cleanup EXIT

          if ! MOE_LOCAL_BASE_URL=http://127.0.0.1:8787 \
            MOE_LOCAL_CONTROL_PIN="$MOE_LOCAL_CONTROL_PIN" \
            node test/mobile-local-e2e.mjs; then
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Wrangler dry-run
        working-directory: worker
        run: pnpm exec wrangler deploy --dry-run
