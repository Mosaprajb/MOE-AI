name: Deploy Mobile Scanner Visible UI

on:
  push:
    branches:
      - feature/moe-core-domain-v2
    paths:
      - 'worker/src/mobile-scanner-visible-ui.js'
      - 'worker/src/sandbox-mobile-account-balances-entry.js'
      - 'worker/test/mobile-scanner-monitor-contract.test.mjs'
      - '.github/workflows/deploy-mobile-scanner-visible-ui.yml'

permissions:
  contents: read

concurrency:
  group: deploy-mobile-scanner-visible-ui
  cancel-in-progress: false

jobs:
  test-deploy-verify:
    name: Test, deploy, and verify visible mobile scanner UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate visible scanner source
        run: node --check worker/src/mobile-scanner-visible-ui.js

      - name: Test mobile scanner UI contract
        run: node --test --test-concurrency=1 worker/test/mobile-scanner-monitor-contract.test.mjs

      - name: Test Sandbox entry and Live safety chain
        run: |
          node --test --test-concurrency=1 worker/test/sandbox-simulation-mode.test.mjs
          node --test --test-concurrency=1 worker/test/sandbox-runtime-pilot-observability.test.mjs

      - name: Run complete Worker suite
        run: npm run test:worker

      - name: Confirm Sandbox deployment safety
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('wrangler.sandbox.jsonc', 'utf8'));
          const expected = {
            MOE_SANDBOX_PILOT_ENABLED: 'false',
            MOE_LIVE_MODE_UNLOCKED: 'false',
            MOE_LIVE_EXECUTION_IMPLEMENTED: 'false',
            WEBULL_LIVE_TRADING: 'false',
            WEBULL_LIVE_ORDER_SUBMISSION: 'false',
            WEBULL_LIVE_AUTOMATION_ARMED: 'false',
            WEBULL_LIVE_KILL_SWITCH: 'true',
          };
          if (config.main !== 'worker/src/sandbox-mobile-account-balances-entry.js') {
            throw new Error(`Unexpected Sandbox entry: ${config.main}`);
          }
          for (const [key, value] of Object.entries(expected)) {
            if (config.vars?.[key] !== value) throw new Error(`${key} must remain ${value}`);
          }
          console.log(JSON.stringify({ sandboxEntry: config.main, ...expected }, null, 2));
          NODE

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed visible scanner UI
        env:
          MOBILE_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/m
          MONITOR_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/scanner/monitor?symbol=SPY
        run: |
          node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function retry(label, operation) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                return await operation();
              } catch (error) {
                lastError = error;
                console.log(`${label} attempt ${attempt} failed: ${error.message}`);
                await wait(5000);
              }
            }
            throw lastError || new Error(`${label} unavailable`);
          }

          const html = await retry('mobile dashboard', async () => {
            const response = await fetch(`${process.env.MOBILE_URL}?visible-scanner=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          });

          for (const token of [
            'id="moe-mobile-scanner-visible-ui"',
            'data-moe-monitor-location',
            "monitorMarkup('main')",
            "monitorMarkup('scanner')",
            'Selected symbol live monitor',
            'data-moe-monitor-refresh',
            'data-moe-monitor-field="price"',
            'data-moe-monitor-field="entry"',
            'data-moe-monitor-field="exit"',
            'data-moe-monitor-field="stop"',
            'moeActivityRefreshVisible',
            'moeActivityClearVisible',
            'Clear old',
          ]) {
            if (!html.includes(token)) throw new Error(`Mobile dashboard missing ${token}`);
          }

          const monitor = await retry('scanner monitor API', async () => {
            const response = await fetch(`${process.env.MONITOR_URL}&t=${Date.now()}`, {
              cache: 'no-store',
              headers: { 'x-moe-mobile-client': '1', accept: 'application/json' },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${payload.error || 'unknown error'}`);
            return payload;
          });

          if (monitor.ok !== true || monitor.symbol !== 'SPY') throw new Error('Scanner monitor response is invalid');
          if (!monitor.quote || !Object.hasOwn(monitor.quote, 'price')) throw new Error('Live quote field is missing');
          if (!monitor.readiness || !Number.isFinite(Number(monitor.readiness.percent))) throw new Error('Readiness percent is missing');
          if (!monitor.safety?.liveTradingLocked || monitor.safety?.liveFundsUsed !== false) {
            throw new Error('Live safety lock changed unexpectedly');
          }

          console.log(JSON.stringify({
            deployed: true,
            visibleOnMainSymbolsCard: true,
            visibleInScannerHistory: true,
            activityRefresh: true,
            activityClear: true,
            symbol: monitor.symbol,
            livePrice: monitor.quote.price,
            entryPrice: monitor.plan?.entryPrice ?? null,
            exitPrice: monitor.plan?.exitPrice ?? null,
            stopLossPrice: monitor.plan?.stopLossPrice ?? null,
            readinessPercent: monitor.readiness.percent,
            liveTradingLocked: true,
          }, null, 2));
          NODE