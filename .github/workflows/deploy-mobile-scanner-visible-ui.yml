name: Deploy Mobile Scanner Visible UI

on:
  push:
    branches:
      - feature/moe-core-domain-v2
    paths:
      - 'worker/src/mobile-scanner-visible-ui.js'
      - 'worker/src/mobile-paper-broker-gate.js'
      - 'worker/src/sandbox-mobile-live-watchlist-entry.js'
      - 'worker/src/sandbox-moerand-clean-utbot-entry.js'
      - 'worker/src/sandbox-mobile-account-balances-entry.js'
      - 'worker/src/sandbox-mobile-account-balances-implementation.js'
      - 'worker/test/mobile-live-watchlist.test.mjs'
      - 'worker/test/mobile-scanner-monitor-contract.test.mjs'
      - 'worker/test/moerand-clean-mobile-settings.test.mjs'
      - 'worker/test/sandbox-operations-dashboard.test.mjs'
      - 'worker/test/sandbox-runtime-pilot-observability.test.mjs'
      - 'worker/test/sandbox-simulation-mode.test.mjs'
      - 'wrangler.sandbox.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-mobile-scanner-visible-ui.yml'

permissions:
  contents: read

concurrency:
  group: deploy-mobile-scanner-visible-ui
  cancel-in-progress: false

jobs:
  test-deploy-verify:
    name: Test, deploy, and verify visible mobile scanner UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate mobile UI sources
        run: |
          node --check worker/src/mobile-scanner-visible-ui.js
          node --check worker/src/sandbox-mobile-live-watchlist-entry.js

      - name: Test mobile scanner and live watchlist contracts
        run: |
          node --test --test-concurrency=1 worker/test/mobile-scanner-monitor-contract.test.mjs
          node --test --test-concurrency=1 worker/test/mobile-live-watchlist.test.mjs

      - name: Test Sandbox entry and Live safety chain
        run: |
          node --test --test-concurrency=1 worker/test/sandbox-simulation-mode.test.mjs
          node --test --test-concurrency=1 worker/test/sandbox-runtime-pilot-observability.test.mjs
          node --test --test-concurrency=1 worker/test/sandbox-operations-dashboard.test.mjs

      - name: Run complete Worker suite
        run: npm run test:worker

      - name: Confirm Sandbox deployment safety
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('wrangler.sandbox.jsonc', 'utf8'));
          const watchlistEntry = readFileSync('worker/src/sandbox-mobile-live-watchlist-entry.js', 'utf8');
          const cleanEntry = readFileSync('worker/src/sandbox-moerand-clean-utbot-entry.js', 'utf8');
          const accountEntry = readFileSync('worker/src/sandbox-mobile-account-balances-entry.js', 'utf8');
          const implementation = readFileSync('worker/src/sandbox-mobile-account-balances-implementation.js', 'utf8');
          const expected = {
            MOE_SANDBOX_PILOT_ENABLED: 'false',
            MOE_LIVE_MODE_UNLOCKED: 'false',
            MOE_LIVE_EXECUTION_IMPLEMENTED: 'false',
            WEBULL_LIVE_TRADING: 'false',
            WEBULL_LIVE_ORDER_SUBMISSION: 'false',
            WEBULL_LIVE_AUTOMATION_ARMED: 'false',
            WEBULL_LIVE_KILL_SWITCH: 'true',
          };
          if (config.main !== 'worker/src/sandbox-mobile-live-watchlist-entry.js') {
            throw new Error(`Unexpected Sandbox entry: ${config.main}`);
          }
          if (!/from '\.\/sandbox-moerand-clean-utbot-entry\.js'/.test(watchlistEntry)) {
            throw new Error('Live watchlist wrapper does not delegate to the Clean wrapper');
          }
          if (!/from '\.\/sandbox-mobile-account-balances-entry\.js'/.test(cleanEntry)) {
            throw new Error('Clean wrapper does not delegate to the protected mobile account entry');
          }
          if (!/from '\.\/sandbox-mobile-account-balances-implementation\.js'/.test(accountEntry)) {
            throw new Error('Mobile account wrapper does not delegate to its protected implementation');
          }
          for (const [key, value] of Object.entries(expected)) {
            if (config.vars?.[key] !== value) throw new Error(`${key} must remain ${value}`);
          }
          for (const token of [
            "WEBULL_LIVE_TRADING: 'false'",
            "WEBULL_LIVE_ORDER_SUBMISSION: 'false'",
            "WEBULL_LIVE_AUTOMATION_ARMED: 'false'",
            "WEBULL_LIVE_KILL_SWITCH: 'true'",
          ]) {
            if (!implementation.includes(token)) throw new Error(`Implementation missing safety token: ${token}`);
          }
          for (const token of [
            '/api/mobile/watchlist/quotes',
            'data.alpaca.markets/v2/stocks/snapshots',
            'liveTradingLocked: true',
            'liveFundsUsed: false',
          ]) {
            if (!watchlistEntry.includes(token)) throw new Error(`Watchlist missing safety token: ${token}`);
          }
          if (implementation.includes('placeWebullSandboxOrder') || watchlistEntry.includes('placeWebullSandboxOrder')) {
            throw new Error('Read-only mobile layers must not submit orders');
          }
          console.log(JSON.stringify({
            sandboxEntry: config.main,
            wrapperChainVerified: true,
            implementationSafetyVerified: true,
            liveWatchlistVerified: true,
            ...expected,
          }, null, 2));
          NODE

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed visible scanner UI and live watchlist
        env:
          MOBILE_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/m
          MONITOR_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/scanner/monitor?symbol=SPY
          WATCHLIST_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/mobile/watchlist/quotes?symbols=SPY,AAPL
        run: |
          node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function retry(label, operation) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                return await operation();
              } catch (error) {
                lastError = error;
                console.log(`${label} attempt ${attempt} failed: ${error.message}`);
                await wait(5000);
              }
            }
            throw lastError || new Error(`${label} unavailable`);
          }

          const html = await retry('mobile dashboard', async () => {
            const response = await fetch(`${process.env.MOBILE_URL}?visible-scanner=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          });

          for (const token of [
            'id="moe-mobile-scanner-visible-ui"',
            'id="moe-live-watchlist-script"',
            'moe-watch-row',
            'Live prices · IEX',
            'Top movers',
            'data-moe-monitor-location',
            "makeMonitor('main')",
            "makeMonitor('scanner')",
            'Selected symbol live monitor',
            'data-moe-monitor-refresh',
            'data-moe-monitor-field="price"',
            'data-moe-monitor-field="entry"',
            'data-moe-monitor-field="exit"',
            'data-moe-monitor-field="stop"',
            'moeActivityRefreshVisible',
            'moeActivityClearVisible',
            'Clear old',
          ]) {
            if (!html.includes(token)) throw new Error(`Mobile dashboard missing ${token}`);
          }

          const headers = { 'x-moe-mobile-client': '1', accept: 'application/json' };
          const monitor = await retry('scanner monitor API', async () => {
            const response = await fetch(`${process.env.MONITOR_URL}&t=${Date.now()}`, { cache: 'no-store', headers });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${payload.error || 'unknown error'}`);
            return payload;
          });

          if (monitor.ok !== true || monitor.symbol !== 'SPY') throw new Error('Scanner monitor response is invalid');
          if (!monitor.quote || !Object.hasOwn(monitor.quote, 'price')) throw new Error('Live quote field is missing');
          if (!monitor.readiness || !Number.isFinite(Number(monitor.readiness.percent))) throw new Error('Readiness percent is missing');
          if (!monitor.safety?.liveTradingLocked || monitor.safety?.liveFundsUsed !== false) {
            throw new Error('Live safety lock changed unexpectedly');
          }

          const watchlist = await retry('live watchlist API', async () => {
            const response = await fetch(`${process.env.WATCHLIST_URL}&t=${Date.now()}`, { cache: 'no-store', headers });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.ok !== true) throw new Error(`HTTP ${response.status}: ${payload.error || 'invalid payload'}`);
            return payload;
          });
          if (!Array.isArray(watchlist.quotes) || watchlist.quotes.length !== 2) throw new Error('Watchlist quote count is invalid');
          if (!watchlist.quotes.every((quote) => quote.symbol && Object.hasOwn(quote, 'price'))) {
            throw new Error('Watchlist prices are missing');
          }
          if (watchlist.liveTradingLocked !== true || watchlist.liveFundsUsed !== false) {
            throw new Error('Watchlist safety lock changed unexpectedly');
          }

          console.log(JSON.stringify({
            deployed: true,
            visibleOnMainSymbolsCard: true,
            modernLiveWatchlist: true,
            watchlistSymbols: watchlist.quotes.map((quote) => quote.symbol),
            watchlistPrices: watchlist.quotes.map((quote) => quote.price),
            visibleInScannerHistory: true,
            activityRefresh: true,
            activityClear: true,
            symbol: monitor.symbol,
            livePrice: monitor.quote.price,
            entryPrice: monitor.plan?.entryPrice ?? null,
            exitPrice: monitor.plan?.exitPrice ?? null,
            stopLossPrice: monitor.plan?.stopLossPrice ?? null,
            readinessPercent: monitor.readiness.percent,
            liveTradingLocked: true,
          }, null, 2));
          NODE
