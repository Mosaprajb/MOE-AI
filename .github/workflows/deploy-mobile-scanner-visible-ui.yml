name: Deploy TradingView Mobile Control

on:
  push:
    branches:
      - feature/moe-core-domain-v2
    paths:
      - 'worker/src/tradingview-only-*.js'
      - 'worker/src/sandbox-mobile-market-screener-resilient-entry.js'
      - 'worker/test/tradingview-only*.test.mjs'
      - 'worker/test/sandbox-runtime-pilot-observability.test.mjs'
      - 'wrangler.sandbox.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-mobile-scanner-visible-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tradingview-mobile-control
  cancel-in-progress: true

jobs:
  test-deploy-verify:
    name: Test, deploy, and verify TradingView mobile control
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate TradingView source syntax
        run: |
          for file in worker/src/tradingview-only-*.js worker/src/sandbox-mobile-market-screener-resilient-entry.js; do
            node --check "$file"
          done

      - name: Test TradingView execution and mobile contracts
        run: node --test --test-concurrency=1 worker/test/tradingview-only*.test.mjs

      - name: Run complete Worker suite
        run: npm run test:worker

      - name: Confirm TradingView-only Sandbox safety
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('wrangler.sandbox.jsonc', 'utf8'));
          const entry = readFileSync('worker/src/sandbox-mobile-market-screener-resilient-entry.js', 'utf8');
          const broker = readFileSync('worker/src/tradingview-only-broker.js', 'utf8');
          const pnl = readFileSync('worker/src/tradingview-only-pnl-control-patch.js', 'utf8');

          const expected = {
            MOE_SANDBOX_PILOT_ENABLED: 'false',
            MOE_LIVE_MODE_UNLOCKED: 'false',
            MOE_LIVE_EXECUTION_IMPLEMENTED: 'false',
            WEBULL_LIVE_TRADING: 'false',
            WEBULL_LIVE_ORDER_SUBMISSION: 'false',
            WEBULL_LIVE_AUTOMATION_ARMED: 'false',
            WEBULL_LIVE_KILL_SWITCH: 'true',
            MOE_TRADINGVIEW_ONLY: 'true',
            MOE_TRADINGVIEW_LIVE_ENABLED: 'false',
            AUTO_SCANNER_ENABLED: 'false',
            SMART_SCANNER_SCHEDULER_ENABLED: 'false',
          };

          if (config.main !== 'worker/src/sandbox-mobile-market-screener-resilient-entry.js') {
            throw new Error(`Unexpected Sandbox entry: ${config.main}`);
          }
          for (const [key, value] of Object.entries(expected)) {
            if (config.vars?.[key] !== value) throw new Error(`${key} must remain ${value}`);
          }
          for (const token of [
            'tradingview-only-safari-auth-entry.js',
            'tradingview-only-pnl-control-patch.js',
            'tradingViewPnlControlPatch',
          ]) {
            if (!entry.includes(token)) throw new Error(`Deployment entry missing ${token}`);
          }
          for (const token of ['dayPnl', 'realizedPnl', 'unrealizedPnl', 'pnlSource']) {
            if (!broker.includes(token)) throw new Error(`Broker summary missing ${token}`);
          }
          for (const token of ['moe-pnl-control-style-v1', 'moe-pnl-control-script-v1', 'P&L', 'Run checks']) {
            if (!pnl.includes(token)) throw new Error(`P&L control patch missing ${token}`);
          }
          console.log(JSON.stringify({
            sandboxEntry: config.main,
            tradingViewOnly: true,
            scannerExecutionEnabled: false,
            liveTradingLocked: true,
            brokerPnlEnabled: true,
            pnlControlsEnabled: true,
          }, null, 2));
          NODE

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed TradingView mobile control
        env:
          WORKER_ORIGIN: https://moerand-alerts-sandbox.mosaprajb.workers.dev
        run: |
          node <<'NODE'
          const origin = process.env.WORKER_ORIGIN;
          const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function retry(label, operation) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                return await operation();
              } catch (error) {
                lastError = error;
                console.log(`${label} attempt ${attempt}: ${error.message}`);
                await wait(5000);
              }
            }
            throw lastError;
          }

          await retry('protected mobile route', async () => {
            const response = await fetch(`${origin}/m?t=${Date.now()}`, {
              cache: 'no-store',
              redirect: 'manual',
            });
            if (![301, 302, 303, 307, 308].includes(response.status)) {
              throw new Error(`Expected authentication redirect, received HTTP ${response.status}`);
            }
            const location = response.headers.get('location') || '';
            if (!location.includes('/mobile/login-v2')) {
              throw new Error(`Unexpected authentication destination: ${location}`);
            }
          });

          await retry('standalone login page', async () => {
            const response = await fetch(`${origin}/mobile/login-v2?t=${Date.now()}`, { cache: 'no-store' });
            const html = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            for (const token of ['MOE-AI', '/mobile/unlock', 'الرمز السري']) {
              if (!html.includes(token)) throw new Error(`Login page missing ${token}`);
            }
            if (!String(response.headers.get('cache-control') || '').includes('no-store')) {
              throw new Error('Login page must remain non-cacheable');
            }
          });

          await retry('mobile JavaScript assets', async () => {
            const bootResponse = await fetch(`${origin}/mobile/boot-v4.js?t=${Date.now()}`, { cache: 'no-store' });
            const clientResponse = await fetch(`${origin}/mobile/client-v4.js?t=${Date.now()}`, { cache: 'no-store' });
            const [boot, client] = await Promise.all([bootResponse.text(), clientResponse.text()]);
            if (!bootResponse.ok || !clientResponse.ok) {
              throw new Error(`Asset HTTP status: boot=${bootResponse.status}, client=${clientResponse.status}`);
            }
            if (!boot.includes('loadStatus')) throw new Error('Mobile boot asset is incomplete');
            if (!client.includes('__MOE_MAIN_CLIENT_READY__')) throw new Error('Mobile client asset is incomplete');
          });

          await retry('webhook authentication barrier', async () => {
            const response = await fetch(`${origin}/api/tradingview/signal?t=${Date.now()}`, {
              method: 'POST',
              cache: 'no-store',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ ticker: 'AAPL', signal: 'BUY', price: 1 }),
            });
            const payload = await response.json().catch(() => ({}));
            if (response.status !== 401 || payload.ok !== false) {
              throw new Error(`Unauthorized webhook was not rejected: HTTP ${response.status}`);
            }
          });

          await retry('legacy execution barrier', async () => {
            const response = await fetch(`${origin}/api/tradingview/webull-preview?t=${Date.now()}`, {
              cache: 'no-store',
              redirect: 'manual',
            });
            const payload = await response.json().catch(() => ({}));
            if (response.status !== 410 || payload.blocked !== true) {
              throw new Error(`Legacy execution path is not blocked: HTTP ${response.status}`);
            }
          });

          console.log(JSON.stringify({
            deployed: true,
            authenticationProtected: true,
            mobileAssetsHealthy: true,
            webhookSecretRequired: true,
            legacyExecutionBlocked: true,
          }, null, 2));
          NODE
