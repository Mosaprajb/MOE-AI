name: Validate Simulation Session Limits

on:
  push:
    branches:
      - feature/moe-core-domain-v2

permissions:
  contents: read

concurrency:
  group: validate-simulation-session-limits
  cancel-in-progress: false

jobs:
  test-deploy-verify:
    name: Test, deploy, and verify Sandbox session limits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run session-limit tests
        run: node --test worker/test/simulation-strategy-session-limits.test.mjs

      - name: Run complete Worker safety suite
        run: npm run test:worker

      - name: Confirm Sandbox safety configuration
        shell: bash
        run: |
          grep -F '"MOE_SANDBOX_PILOT_ENABLED": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_TRADING": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_ORDER_SUBMISSION": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_AUTOMATION_ARMED": "false"' wrangler.sandbox.jsonc
          grep -F '"WEBULL_LIVE_KILL_SWITCH": "true"' wrangler.sandbox.jsonc
          grep -F '"MOE_MAX_PORTFOLIO_RISK_PERCENT": "0.5"' wrangler.sandbox.jsonc
          grep -F '"MOE_MAX_DAILY_LOSS_PERCENT": "0.5"' wrangler.sandbox.jsonc
          grep -F '"MOE_STRATEGY_FUSION_V2_MAX_DAILY_TRADES": "1"' wrangler.sandbox.jsonc
          grep -F '"MOE_STRATEGY_MOERAND_SIMPLE_INTERNAL_MAX_DAILY_TRADES": "2"' wrangler.sandbox.jsonc
          grep -F '"MOE_STRATEGY_MOERAND_SCALP_INTERNAL_MAX_DAILY_TRADES": "20"' wrangler.sandbox.jsonc

      - name: Build Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.sandbox.jsonc

      - name: Deploy Cloudflare Sandbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sandbox.jsonc

      - name: Verify deployed dashboard and registry
        env:
          DASHBOARD_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/dashboard
          CAPACITY_URL: https://moerand-alerts-sandbox.mosaprajb.workers.dev/api/strategies/capacity
        run: |
          node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function fetchRetry(url, type) {
            let last;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${url}?verify=${Date.now()}`, { cache: 'no-store' });
                if (response.ok) return type === 'json' ? response.json() : response.text();
                last = new Error(`HTTP ${response.status}`);
              } catch (error) {
                last = error;
              }
              await wait(5000);
            }
            throw last;
          }

          const dashboard = await fetchRetry(process.env.DASHBOARD_URL, 'text');
          for (const token of [
            'MOERAND_SCALP_INTERNAL',
            'SESSION LIMIT',
            'moeSimulationScript',
          ]) {
            if (!dashboard.includes(token)) throw new Error(`Dashboard missing ${token}`);
          }

          const payload = await fetchRetry(process.env.CAPACITY_URL, 'json');
          const rows = Object.fromEntries((payload.strategyCapacity?.strategies || []).map((row) => [row.id, row]));
          const expected = {
            FUSION_V2: 1,
            MOERAND_SIMPLE_INTERNAL: 2,
            MOERAND_SCALP_INTERNAL: 20,
          };
          for (const [id, maximum] of Object.entries(expected)) {
            if (!rows[id]) throw new Error(`Registry missing ${id}`);
            if (rows[id].maxDailyTrades !== maximum) {
              throw new Error(`${id} expected maximum ${maximum}, received ${rows[id].maxDailyTrades}`);
            }
          }
          const global = payload.strategyCapacity?.globalPortfolioLimits || {};
          if (global.maximumPortfolioRiskPercent !== 0.5) throw new Error('Portfolio risk ceiling changed');
          if (global.maximumDailyLossPercent !== 0.5) throw new Error('Daily loss ceiling changed');
          if (global.authoritative !== true || global.perStrategyLimitsCanBypass !== false) {
            throw new Error('Global risk gates are not authoritative');
          }
          if (payload.liveFundsUsed !== false) throw new Error('Live funds must remain unused');

          console.log(JSON.stringify({
            deployed: true,
            dashboardScalpSelector: true,
            dashboardSessionLimit: true,
            perSessionLimits: expected,
            globalPortfolioRiskPercent: global.maximumPortfolioRiskPercent,
            globalDailyLossPercent: global.maximumDailyLossPercent,
            liveFundsUsed: payload.liveFundsUsed,
          }, null, 2));
          NODE
