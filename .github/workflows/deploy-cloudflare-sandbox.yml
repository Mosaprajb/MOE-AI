name: Deploy Cloudflare Worker (Sandbox)

on:
  push:
    branches: [develop, staging]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-sandbox
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.119.0"

jobs:
  deploy-sandbox:
    name: Deploy Worker (isolated Sandbox env)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Worker
        run: pnpm run type-check

      - name: Run mobile Worker tests
        run: pnpm run test:mobile

      - name: Resolve isolated Sandbox resources
        run: node scripts/prepare-sandbox-config-from-settings.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate generated Durable Object exports
        shell: bash
        run: |
          set -euo pipefail
          config=.wrangler.sandbox.ci.toml
          test -s "$config"

          for class_name in AlertCoordinator SimulationDriver TradingViewPositionCoordinator; do
            grep -Fq "[env.sandbox.exports.${class_name}]" "$config"
            section="$(awk -v header="[env.sandbox.exports.${class_name}]" '
              $0 == header { active=1; print; next }
              active && /^\[/ { exit }
              active { print }
            ' "$config")"
            grep -Fq 'type = "durable-object"' <<<"$section"
            grep -Eq '^storage = "(sqlite|legacy-kv)"$' <<<"$section"
          done

          if grep -Eq '^\s*\[\[migrations\]\]' "$config"; then
            echo "Generated Sandbox config unexpectedly contains legacy migrations" >&2
            exit 1
          fi

          echo "Validated Sandbox Durable Object exports:"
          awk '
            /^\[env\.sandbox\.exports\./ { print; active=1; next }
            active && /^(type|storage) = / { print "  " $0; next }
            active && /^\[/ { active=0 }
          ' "$config"

      - name: Deploy isolated Sandbox worker
        run: pnpm dlx wrangler@${WRANGLER_VERSION} deploy --config .wrangler.sandbox.ci.toml --env sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Sandbox D1 migrations
        run: pnpm dlx wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config .wrangler.sandbox.ci.toml --env sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Redeploy after migrations
        run: pnpm dlx wrangler@${WRANGLER_VERSION} deploy --config .wrangler.sandbox.ci.toml --env sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove generated Wrangler config
        if: always()
        run: rm -f .wrangler.sandbox.ci.toml
