name: Deploy Cloudflare Worker (Non-production)

on:
  push:
    branches: [develop, staging]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.119.0"

jobs:
  deploy:
    name: Deploy Worker from local source of truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select deployment environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "DEPLOY_ENV=staging" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=sandbox" >> "$GITHUB_ENV"
          fi

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Worker
        run: pnpm run type-check

      - name: Run mobile Worker tests
        run: pnpm run test:mobile

      - name: Generate deployment config from wrangler.jsonc
        run: node scripts/generate-wrangler-config.mjs "$DEPLOY_ENV"

      - name: Deploy Worker
        run: pnpm dlx wrangler@${WRANGLER_VERSION} deploy --config ".wrangler.${DEPLOY_ENV}.ci.toml"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Materialize deployed D1 and KV bindings
        run: node scripts/materialize-deployment-bindings.mjs "$DEPLOY_ENV" ".wrangler.${DEPLOY_ENV}.ci.toml"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: pnpm dlx wrangler@${WRANGLER_VERSION} d1 migrations apply DB --remote --config ".wrangler.${DEPLOY_ENV}.ci.toml"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Redeploy after D1 migrations
        run: pnpm dlx wrangler@${WRANGLER_VERSION} deploy --config ".wrangler.${DEPLOY_ENV}.ci.toml"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed safety policy
        run: node scripts/verify-deployment-safety.mjs "$DEPLOY_ENV"

      - name: Remove generated Wrangler config
        if: always()
        run: rm -f ".wrangler.${DEPLOY_ENV}.ci.toml"
