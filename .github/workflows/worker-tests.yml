name: Worker tests

on:
  push:
    branches:
      - feature/moe-core-domain-v2
  pull_request:
    paths:
      - 'worker/**'
      - 'wrangler.sandbox.jsonc'
      - 'package.json'
      - '.github/workflows/worker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:worker
