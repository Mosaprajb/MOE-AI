name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.119.0"

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Worker
        run: pnpm run type-check

      - name: Run mobile Worker tests
        run: pnpm run test:mobile

      - name: Generate production config from wrangler.jsonc
        run: node scripts/generate-wrangler-config.mjs production

      - name: Deploy production Worker
        run: pnpm dlx wrangler@${WRANGLER_VERSION} deploy --config .wrangler.production.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed safety policy
        run: node scripts/verify-deployment-safety.mjs production

      - name: Verify Live read-only broker observation
        run: node scripts/verify-live-observation.mjs

      - name: Remove generated Wrangler config
        if: always()
        run: rm -f .wrangler.production.ci.toml
