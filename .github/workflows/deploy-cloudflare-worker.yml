name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  deploy:
    name: Deploy Worker (Production)
    needs: type-check
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Substitute real KV / D1 IDs if the GitHub Secrets are set
      - name: Inject KV and D1 IDs
        run: |
          if [ -n "${{ secrets.KV_NAMESPACE_ID }}" ]; then
            sed -i 's/id = "placeholder"/id = "${{ secrets.KV_NAMESPACE_ID }}"/' wrangler.toml
            echo "✓ KV namespace ID injected"
          else
            echo "⚠ KV_NAMESPACE_ID secret not set — using placeholder (Worker will run without KV)"
          fi
          if [ -n "${{ secrets.D1_DATABASE_ID }}" ]; then
            sed -i "0,/database_id = \"placeholder\"/s/database_id = \"placeholder\"/database_id = \"${{ secrets.D1_DATABASE_ID }}\"/" wrangler.toml
            echo "✓ D1 database ID injected"
          else
            echo "⚠ D1_DATABASE_ID secret not set — using placeholder (Worker will run without D1)"
          fi

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
