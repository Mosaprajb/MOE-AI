name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Type-check & Deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Strip placeholder KV/D1 bindings
        run: |
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("wrangler.toml")
          txt = p.read_text()

          kv_id  = "${{ secrets.KV_NAMESPACE_ID }}"
          d1_id  = "${{ secrets.D1_DATABASE_ID }}"

          if kv_id:
              txt = txt.replace('id = "placeholder"', f'id = "{kv_id}"', 1)
              print(f"✓ KV namespace ID injected")
          else:
              txt = re.sub(r'\[\[kv_namespaces\]\][^\[]*', '', txt, flags=re.DOTALL)
              print("⚠ KV_NAMESPACE_ID not set — KV binding removed")

          if d1_id:
              txt = txt.replace('database_id = "placeholder"', f'database_id = "{d1_id}"', 1)
              print(f"✓ D1 database ID injected")
          else:
              txt = re.sub(r'\[\[d1_databases\]\][^\[]*', '', txt, flags=re.DOTALL)
              print("⚠ D1_DATABASE_ID not set — D1 binding removed")

          p.write_text(txt)
          PYEOF

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy src/index.ts
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
