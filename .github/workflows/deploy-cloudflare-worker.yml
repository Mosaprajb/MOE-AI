name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  deploy:
    name: Deploy Worker (Production)
    needs: type-check
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # If real IDs are provided as secrets, inject them.
      # If not, strip the KV/D1 bindings so wrangler can still deploy.
      - name: Configure KV and D1 bindings
        run: |
          KV_ID="${{ secrets.KV_NAMESPACE_ID }}"
          D1_ID="${{ secrets.D1_DATABASE_ID }}"

          if [ -n "$KV_ID" ]; then
            sed -i "s/id = \"placeholder\"/id = \"$KV_ID\"/" wrangler.toml
            echo "✓ KV namespace ID injected"
          else
            # Remove the entire [[kv_namespaces]] block so wrangler doesn't fail
            python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("wrangler.toml")
          txt = p.read_text()
          txt = re.sub(r'\[\[kv_namespaces\]\][^\[]*', '', txt, flags=re.DOTALL)
          txt = re.sub(r'\[\[env\.sandbox\.kv_namespaces\]\][^\[]*', '', txt, flags=re.DOTALL)
          p.write_text(txt)
          print("⚠ KV_NAMESPACE_ID not set — KV binding removed for this deploy")
          PYEOF
          fi

          if [ -n "$D1_ID" ]; then
            sed -i "s/database_id = \"placeholder\"/database_id = \"$D1_ID\"/" wrangler.toml
            echo "✓ D1 database ID injected"
          else
            python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("wrangler.toml")
          txt = p.read_text()
          txt = re.sub(r'\[\[d1_databases\]\][^\[]*', '', txt, flags=re.DOTALL)
          txt = re.sub(r'\[\[env\.sandbox\.d1_databases\]\][^\[]*', '', txt, flags=re.DOTALL)
          p.write_text(txt)
          print("⚠ D1_DATABASE_ID not set — D1 binding removed for this deploy")
          PYEOF
          fi

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
