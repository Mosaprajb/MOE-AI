name: iOS Build

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - "agent/ios-native-build"
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test MOEAI
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project files
        run: ios/MOEAI/scripts/validate-project.sh

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/MOEAI/MOEAI.xcodeproj \
            -scheme MOEAI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/MOEAI-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean test \
            | tee "$RUNNER_TEMP/moeai-xcodebuild.log"

      - name: Run Xcode static analyzer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/MOEAI/MOEAI.xcodeproj \
            -scheme MOEAI \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/MOEAI-AnalyzeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            analyze \
            | tee "$RUNNER_TEMP/moeai-analyze.log"

      - name: Build Release for simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/MOEAI/MOEAI.xcodeproj \
            -scheme MOEAI \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/MOEAI-ReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee "$RUNNER_TEMP/moeai-release-build.log"

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moeai-xcode-logs
          path: |
            ${{ runner.temp }}/moeai-xcodebuild.log
            ${{ runner.temp }}/moeai-analyze.log
            ${{ runner.temp }}/moeai-release-build.log
          if-no-files-found: ignore
          retention-days: 7
