name = "moerand-alerts"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── KV Namespace (optional — add later for persistent kill-switch/mode) ───────
# To enable: wrangler kv namespace create "CONFIG"
# Then replace the id below and uncomment:
# [[kv_namespaces]]
# binding = "CONFIG"
# id = "your-kv-namespace-id-here"

# ── D1 Database (optional — add later for trade history) ──────────────────────
# To enable: wrangler d1 create moe-db
# Then replace the id below and uncomment:
# [[d1_databases]]
# binding = "DB"
# database_name = "moe-db"
# database_id = "your-d1-database-id-here"

# ── Cloudflare Secrets (set via: wrangler secret put <NAME>) ──────────────────
# WEBULL_SANDBOX_APP_KEY         — paper trading app key
# WEBULL_SANDBOX_APP_SECRET      — paper trading app secret
# WEBULL_SANDBOX_ACCESS_TOKEN    — paper trading access token
# WEBULL_SANDBOX_ACCOUNT_ID      — paper trading account ID
# WEBULL_LIVE_APP_KEY            — live trading app key
# WEBULL_LIVE_APP_SECRET         — live trading app secret
# WEBULL_LIVE_ACCESS_TOKEN       — live trading access token
# WEBULL_LIVE_ACCOUNT_ID         — live trading account ID
# MOE_WEBHOOK_SECRET             — shared secret for TradingView webhook validation

[vars]
WORKER_VERSION      = "5.0.0"
MAX_OPEN_POSITIONS  = "4"
MAX_DAILY_TRADES    = "8"
MAX_DAILY_LOSS_PCT  = "2"
MAX_OPEN_RISK_PCT   = "2"
MAX_PORTFOLIO_HEAT  = "6"
ALLOWED_ORIGINS     = "https://moerand-alerts.mosaprajb.workers.dev,https://moe-ai.replit.app,https://*.replit.dev,https://*.replit.app,http://127.0.0.1"
